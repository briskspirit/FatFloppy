name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app and installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -e .

      - name: Convert icon to ICO format
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icons/fatfloppy_icon.png'); img.save('assets/icons/fatfloppy_icon.ico', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller packaging/windows/FatFloppy.spec

      - name: Get version
        id: version
        run: |
          $version = python -c "exec(open('src/fatfloppy/_version.py').read()); print(__version__)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.VERSION }} packaging\windows\installer.iss

      - name: Create portable ZIP
        run: |
          Compress-Archive -Path "dist\FatFloppy" -DestinationPath "dist\FatFloppy-${{ steps.version.outputs.VERSION }}-Windows-Portable.zip"
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatFloppy-Windows-Installer
          path: dist/*-Setup.exe
          retention-days: 30

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatFloppy-Windows-Portable
          path: dist/FatFloppy/
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*-Setup.exe
            dist/*-Portable.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            python_arch: arm64
            venv: .venv_arm64
          - arch: x86_64
            python_arch: x64
            venv: .venv_x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rosetta (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Build DMG
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x packaging/macos/build_macos.sh

          # Clean output dirs to avoid cross-arch contamination between matrix runs
          rm -rf build dist || true

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # Intel build under Rosetta using x64 Python
            arch -x86_64 python -m venv "${{ matrix.venv }}"
            source "${{ matrix.venv }}/bin/activate"

            arch -x86_64 python -m pip install -U pip
            arch -x86_64 python -m pip install --no-cache-dir pyinstaller
            arch -x86_64 python -m pip install --no-cache-dir -e .

            # Hard-fix for common "mixed arch wheel" problems (like bitarray)
            arch -x86_64 python -m pip install --no-cache-dir --force-reinstall bitarray

            arch -x86_64 packaging/macos/build_macos.sh
          else
            # Native arm64 build
            python -m venv "${{ matrix.venv }}"
            source "${{ matrix.venv }}/bin/activate"

            python -m pip install -U pip
            python -m pip install --no-cache-dir pyinstaller
            python -m pip install --no-cache-dir -e .

            packaging/macos/build_macos.sh
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatFloppy-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build_appimage.sh
          bash packaging/linux/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatFloppy-Linux-AppImage
          path: '*.AppImage'
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: '*.AppImage'
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
