name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            python_arch: arm64
          - arch: x86_64
            python_arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rosetta (only needed for Intel build)
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}   # x64 or arm64
        # setup-python supports architecture = x86/x64/arm64  [oai_citation:2‡GitHub](https://github.com/actions/setup-python?utm_source=chatgpt.com)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build DMG
        run: |
          chmod +x packaging/macos/build_macos.sh
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 packaging/macos/build_macos.sh
          else
            packaging/macos/build_macos.sh
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatFloppy-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
