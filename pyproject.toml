# pyproject.toml
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FatFloppy"
# Pull version from fatfloppy/_version.py
dynamic = ["version"]
description = "Graphical utility for working with vintage floppy images via Greaseweazle."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "greaseweazle",
  "PyQt6",
]

# Optional, but keeps your trove classifiers
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
  "Environment :: X11 Applications :: Qt",
  "Environment :: MacOS X :: Cocoa",
  "Environment :: Win32 (MS Windows)",
]

[project.gui-scripts]
fatfloppy = "fatfloppy.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true  # keep if you rely on MANIFEST.in or package_data

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fatfloppy._version.__version__"}

# ============================================================================
# Ruff Configuration - Code Formatting & Linting
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py39"  # Match your minimum Python version

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable these rule sets (good balance for portfolio projects)
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
]

# Ignore specific rules if needed
ignore = [
    "E501",   # Line too long (handled by formatter)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Sort imports nicely
known-first-party = ["fatfloppy"]

[tool.ruff.format]
# Use double quotes (PEP 8 default)
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Unix line endings
line-ending = "auto"
